<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="t d"><title id="t">Üç katlı eğitim modelinde statik öteleme</title><desc id="d">Gerçek bina değildir. Çatıya uygulanan 100 kilonewton yatay kuvvet altında kat ötelemeleri 5, 11,67 ve 21,67 milimetredir.</desc><rect width="900" height="500" fill="#f5f7fa"/><g font-family="Arial, sans-serif" fill="#172537"><text x="45" y="48" font-size="26" font-weight="bold">Eğitim modeli · Statik öteleme</text><text x="45" y="80" font-size="16">Çatı kuvveti: 100 kN · Doğrusal kayma modeli · Ötelemeler büyütülmüştür</text><line x1="130" y1="385" x2="130" y2="121" stroke="#7f8b9c" stroke-width="2"/><line x1="100" y1="385" x2="355" y2="385" stroke="#ccd3dd" stroke-dasharray="4 5"/><circle cx="130" cy="385" r="7" fill="#cb2429"/><text x="380" y="391" font-size="17">Sabit taban</text><line x1="130" y1="385" x2="175.0" y2="297" stroke="#cb2429" stroke-width="4"/><line x1="100" y1="297" x2="355" y2="297" stroke="#ccd3dd" stroke-dasharray="4 5"/><circle cx="175.0" cy="297" r="7" fill="#cb2429"/><text x="380" y="303" font-size="17">Kat 1 · u = 5.00 mm</text><line x1="175.0" y1="297" x2="235.00000000000006" y2="209" stroke="#cb2429" stroke-width="4"/><line x1="100" y1="209" x2="355" y2="209" stroke="#ccd3dd" stroke-dasharray="4 5"/><circle cx="235.00000000000006" cy="209" r="7" fill="#cb2429"/><text x="380" y="215" font-size="17">Kat 2 · u = 11.67 mm</text><line x1="235.00000000000006" y1="209" x2="325.0000000000001" y2="121" stroke="#cb2429" stroke-width="4"/><line x1="100" y1="121" x2="355" y2="121" stroke="#ccd3dd" stroke-dasharray="4 5"/><circle cx="325.0000000000001" cy="121" r="7" fill="#cb2429"/><text x="380" y="127" font-size="17">Kat 3 · u = 21.67 mm</text><text x="45" y="435" font-size="16">Kırmızı: hesaplanan şekil · Gri: başlangıç ekseni · Yatay ölçek: 9 px/mm</text><text x="45" y="465" font-size="15" font-weight="bold">YAPIGÜÇ eğitim örneği — Program ekranı veya gerçek proje sonucu değildir.</text></g></svg>